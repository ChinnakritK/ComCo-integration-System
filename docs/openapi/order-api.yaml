openapi: 3.1.0
info:
  title: ComCo Order API
  summary: Customer orders for the ComCo Customer Service Integration Platform.
  description: 'Owned by the **Order Service**, backed by its own PostgreSQL database.
    Orders reference customers by `customer_id` only (database-per-service - no cross-service
    joins).


    External consumers reach this API **only through the Kong API gateway** at `/api/v1/orders`
    using an `apikey` header. All errors use RFC 7807 Problem Details.'
  version: 1.0.0
servers:
- url: http://localhost:8000/api/v1
  description: Via Kong API gateway
paths:
  /orders:
    get:
      tags:
      - orders
      summary: List / search orders
      description: Filter by customer and status. Default sort is newest first.
      operationId: list_orders
      parameters:
      - name: customer_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^C\d{3,}$
          - type: 'null'
          title: Customer Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OrderStatus'
          - type: 'null'
          title: Status
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortOrder'
          default: -created_at
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Data store unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - orders
      summary: Place an order
      description: The total is always computed server-side from the line items.
      operationId: create_order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Data store unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders/latest:
    get:
      tags:
      - orders
      summary: Get a customer's most recent order
      description: Purpose-built for the *customer + latest order* use case (and the
        agents' `get_latest_order` tool). Returns 404 `NO_ORDERS_FOR_CUSTOMER` when
        the customer has no orders. The Order Service does not verify that the customer
        exists - that is the Customer Service's responsibility.
      operationId: latest_order
      parameters:
      - name: customer_id
        in: query
        required: true
        schema:
          type: string
          pattern: ^C\d{3,}$
          examples:
          - C001
          title: Customer Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: No orders for customer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Data store unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders/{order_id}:
    get:
      tags:
      - orders
      summary: Get an order by ID
      operationId: get_order
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^O\d{4,}$
          description: Order identifier
          examples:
          - O1001
          title: Order Id
        description: Order identifier
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Data store unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders/{order_id}/status:
    patch:
      tags:
      - orders
      summary: Change an order's status
      description: Enforces the order lifecycle, e.g. PENDING -> PAID -> PROCESSING
        -> SHIPPED -> DELIVERED.
      operationId: update_status
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^O\d{4,}$
          description: Order identifier
          examples:
          - O1001
          title: Order Id
        description: Order identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Invalid status transition
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Data store unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Order:
      properties:
        order_id:
          type: string
          title: Order Id
          examples:
          - O1001
        customer_id:
          type: string
          title: Customer Id
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          items:
            $ref: '#/components/schemas/OrderItem-Output'
          type: array
          title: Items
        total_amount:
          type: string
          title: Total Amount
        currency:
          type: string
          title: Currency
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - order_id
      - customer_id
      - status
      - items
      - total_amount
      - currency
      - created_at
      - updated_at
      title: Order
    OrderCreate:
      properties:
        customer_id:
          type: string
          pattern: ^C\d{3,}$
          title: Customer Id
        items:
          items:
            $ref: '#/components/schemas/OrderItem-Input'
          type: array
          maxItems: 50
          minItems: 1
          title: Items
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          title: Currency
          default: THB
      additionalProperties: false
      type: object
      required:
      - customer_id
      - items
      title: OrderCreate
      example:
        currency: THB
        customer_id: C002
        items:
        - name: 5G SIM starter pack
          quantity: 2
          sku: SKU-SIM-5G
          unit_price: '199.00'
    OrderItem-Input:
      properties:
        sku:
          type: string
          maxLength: 64
          minLength: 1
          title: Sku
          examples:
          - SKU-ROUTER-AX3000
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        quantity:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Quantity
        unit_price:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,10}|(?=[\d.]{1,13}0*$)\d{0,10}\.\d{0,2}0*$)
          title: Unit Price
      additionalProperties: false
      type: object
      required:
      - sku
      - name
      - quantity
      - unit_price
      title: OrderItem
    OrderItem-Output:
      properties:
        sku:
          type: string
          maxLength: 64
          minLength: 1
          title: Sku
          examples:
          - SKU-ROUTER-AX3000
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        quantity:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Quantity
        unit_price:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,10}|(?=[\d.]{1,13}0*$)\d{0,10}\.\d{0,2}0*$)
          title: Unit Price
      additionalProperties: false
      type: object
      required:
      - sku
      - name
      - quantity
      - unit_price
      title: OrderItem
    OrderPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Order'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - items
      - total
      - limit
      - offset
      title: OrderPage
    OrderStatus:
      type: string
      enum:
      - PENDING
      - PAID
      - PROCESSING
      - SHIPPED
      - DELIVERED
      - CANCELLED
      title: OrderStatus
    OrderStatusUpdate:
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
      additionalProperties: false
      type: object
      required:
      - status
      title: OrderStatusUpdate
    SortOrder:
      type: string
      enum:
      - -created_at
      - created_at
      title: SortOrder
    Problem:
      type: object
      description: RFC 7807 Problem Details - the single error format used across
        the platform.
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable error code
        correlation_id:
          type: string
        trace_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              type:
                type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: Consumer API key, validated by the Kong gateway (key-auth plugin).
security:
- ApiKeyAuth: []
